name: generate contribution animations

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:        # allow manual trigger
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ankit-kr-maurya-82
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install pacman-contribution-graph
        run: npm install -g pacman-contribution-graph
      - name: generate pacman svg
        run: |
          mkdir -p dist
          pacman-contribution-graph \
            --platform github \
            --username ankit-kr-maurya-82 \
            --output dist/pacman-contribution-graph.svg
      - name: push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
