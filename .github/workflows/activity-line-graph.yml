name: Update Activity Line Graph

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity_line_graph.py
      - .github/workflows/activity-line-graph.yml

permissions:
  contents: write

concurrency:
  group: activity-line-graph
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution line graph
        run: python scripts/activity_line_graph.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ankit-kr-maurya-82
      - name: Publish graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: activity-graph
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
